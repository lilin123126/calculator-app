<!DOCTYPE html>
<html lang="zh-TW" class="theme-latte">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href='data:application/manifest+json,{"name":"超級計算與換算 App Pro Max","short_name":"計算換算","start_url":".","display":"standalone","background_color":"%230f172a","theme_color":"%2338bdf8","icons":[]}'>
    <title>超級計算與換算 App Pro Max ☕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJS (科學計算引擎) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.4.4/math.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Lunar JS (農曆萬年曆引擎) -->
    <script src="https://fastly.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        input, textarea { user-select: text; -webkit-user-select: text; }
        .panel-enter { animation: panelFadeIn 0.3s ease-out; }
        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body, html { height: 100%; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ===== 5 款質感皮膚變數 ===== */
        :root.theme-aurora {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent: #38bdf8; --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
            --border-color: #334155; --btn-bg: #334155; --btn-text: #f8fafc; --note-bg: #0f172a;
        }
        :root.theme-latte {
            --bg-main: #fff8f0; --bg-card: #ffffff; --text-main: #54382b; --text-sub: #9c8275;
            --accent: #e07a5f; --accent-gradient: linear-gradient(135deg, #f2cc8f 0%, #e07a5f 100%);
            --border-color: #f4e4ba; --btn-bg: #fff8eb; --btn-text: #54382b; --note-bg: #fef3e2;
        }
        :root.theme-ocean {
            --bg-main: #f0f8ff; --bg-card: #ffffff; --text-main: #0f4c81; --text-sub: #0284c7;
            --accent: #0284c7; --accent-gradient: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            --border-color: #bae6fd; --btn-bg: #e0f2fe; --btn-text: #0369a1; --note-bg: #e0f2fe;
        }
        :root.theme-forest {
            --bg-main: #f4f7f5; --bg-card: #ffffff; --text-main: #1b4332; --text-sub: #2d6a4f;
            --accent: #40916c; --accent-gradient: linear-gradient(135deg, #16a34a 0%, #4ade80 100%);
            --border-color: #b7e4c7; --btn-bg: #e8f0ec; --btn-text: #1b4332; --note-bg: #dcfce7;
        }
        :root.theme-neon {
            --bg-main: #050505; --bg-card: #18181b; --text-main: #f4f4f5; --text-sub: #a1a1aa;
            --accent: #c084fc; --accent-gradient: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            --border-color: #27272a; --btn-bg: #27272a; --btn-text: #f4f4f5; --note-bg: #18181b;
        }
        :root.theme-oled {
            --bg-main: #000000; --bg-card: #0a0a0a; --text-main: #ffffff; --text-sub: #737373;
            --accent: #ffffff; --accent-gradient: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            --border-color: #1f1f1f; --btn-bg: #1a1a1a; --btn-text: #ffffff; --note-bg: #0a0a0a;
        }

        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }
        .skin-card { background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main); }
        .skin-sub { color: var(--text-sub); }
        .skin-btn { background-color: var(--btn-bg); color: var(--btn-text); border-color: var(--border-color); }
        .skin-accent-bg { background: var(--accent-gradient); color: #ffffff; }
        .skin-accent-text { color: var(--accent); }
        .skin-border { border-color: var(--border-color); }
        .skin-note { background-color: var(--note-bg); border-color: var(--border-color); }
        .btn-active:active { transform: scale(0.96); opacity: 0.85; }

        select { background: transparent; color: inherit; }
        option { background-color: var(--bg-card); color: var(--text-main); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- App 主外殼容器 -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[min(880px,100dvh)] skin-card sm:rounded-[3rem] shadow-2xl flex flex-col overflow-hidden relative border transition-all" style="height: 100dvh; height: -webkit-fill-available;">

        <!-- 頂部導航列 Header -->
        <header class="flex flex-col px-5 pt-4 pb-3 skin-card border-b z-20 shrink-0">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center space-x-3 shrink-0">
                    <button id="back-btn" class="hidden p-2 skin-sub hover:skin-accent-text transition-colors rounded-full -ml-2" onclick="goBack()">
                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                    </button>
                    <div class="flex space-x-6 text-3xl font-bold" id="tab-container">
                        <button id="tab-calc" onclick="switchMainTab('calc')" class="transition-all pb-1 skin-accent-text border-b-4 border-current whitespace-nowrap">計算</button>
                        <button id="tab-convert" onclick="switchMainTab('convert')" class="transition-all pb-1 skin-sub whitespace-nowrap">換算</button>
                    </div>
                    <div id="converter-title" class="hidden text-3xl font-bold skin-text truncate max-w-[180px]">換算</div>
                </div>

                <div class="flex items-center space-x-2 shrink-0">
                    <!-- 🎨 皮膚切換按鈕 (彩色調色盤) -->
                    <button onclick="toggleThemeModal()" title="選擇皮膚"
                        class="p-2.5 rounded-2xl border border-white/60 shadow-md hover:scale-105 active:scale-95 transition-all flex items-center justify-center shrink-0"
                        style="background: linear-gradient(135deg, #ffb3c6 0%, #ffd97d 35%, #a0d8ff 70%, #c9a7ff 100%);">
                        <i data-lucide="palette" class="w-6 h-6 text-white" style="filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));"></i>
                    </button>

                    <!-- 🌐 14 國語言選單 (放大字體，防止截斷) -->
                    <div class="relative flex items-center border skin-border rounded-2xl px-2 py-1.5 skin-btn shadow-sm shrink-0">
                        <select id="lang-selector" onchange="changeLanguage(this.value)" class="text-base font-bold outline-none cursor-pointer pr-3 border-none bg-transparent whitespace-nowrap min-w-fit">
                            <option value="zh-TW">繁體中文</option>
                            <option value="zh-CN">简体中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="vi">Tiếng Việt</option>
                            <option value="th">ภาษาไทย</option>
                            <option value="id">Bahasa Indonesia</option>
                            <option value="es">Español</option>
                            <option value="pt">Português</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="ru">Русский</option>
                            <option value="ar">العربية</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 absolute right-1.5 pointer-events-none skin-sub"></i>
                    </div>
                </div>
            </div>

            <!-- 換算分類頁籤列 (順序：度量衡 -> 生活 -> 金融 -> 時間 -> 專業 -> 全部) -->
            <div id="category-bar" class="hidden mt-3 overflow-x-auto no-scrollbar flex space-x-2.5 pb-1"></div>
        </header>

        <!-- 主內容視窗 -->
        <div class="flex-1 flex flex-col overflow-hidden relative">

            <!-- 1. 計算器主頁面 -->
            <div id="panel-calc" class="flex-1 flex flex-col h-full overflow-y-auto no-scrollbar">
                <!-- 頂部品牌列 + 工具按鈕 -->
                <div class="flex items-center justify-between px-5 pt-2 pb-1.5 shrink-0">
                    <div class="flex items-center gap-2 select-none">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style="background: color-mix(in srgb, var(--accent) 16%, transparent);">
                            <img src="logo.jpg" alt="微光小程序" draggable="false"
                                 class="w-9 h-9 shrink-0 rounded-full object-cover shadow-sm ring-1 ring-white/20">
                        </div>
                        <div class="flex flex-col leading-tight">
                            <div class="text-xl font-black skin-text tracking-widest">微光小程序</div>
                            <div class="text-[10px] skin-sub tracking-[0.15em]">生活·簡單·實用</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="toggleScientific()" class="text-base font-bold skin-sub skin-btn px-3 py-1.5 rounded-full hover:skin-accent-text transition-colors flex items-center gap-1 shadow-sm border cursor-pointer whitespace-nowrap">
                            <i data-lucide="flask-conical" class="w-5 h-5"></i>
                            <span id="sci-btn-text">科學</span>
                        </button>
                        <button onclick="openHistoryModal()" class="text-base font-bold skin-sub skin-btn px-3 py-1.5 rounded-full hover:skin-accent-text transition-colors flex items-center gap-1 shadow-sm border cursor-pointer whitespace-nowrap">
                            <i data-lucide="clock" class="w-5 h-5 shrink-0"></i>
                            <span id="hist-btn-text" class="whitespace-nowrap">歷史</span>
                        </button>
                    </div>
                </div>

                <!-- 顯示區 (垂直置中) -->
                <div class="px-6 py-2 flex flex-col justify-center items-end text-right flex-1">
                    <div id="calc-history-exp" class="skin-sub text-2xl mb-1 min-h-[2.25rem] tracking-wider font-mono"></div>
                    <div id="calc-display" class="skin-text text-5xl sm:text-6xl font-black tracking-tight break-all font-mono transition-all cursor-pointer active:scale-95" title="點擊複製整條算式" onclick="copyDisplay()">0</div>
                </div>

                <!-- 計算機鍵盤區 -->
                <div class="skin-card rounded-t-[2.5rem] border-t p-1.5 flex flex-col gap-1 shadow-2xl mb-24" style="padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem);">
                    <!-- 科學按鈕 Drawer -->
                    <div id="scientific-pad" class="hidden grid grid-cols-5 gap-1.5 mb-1">
                        <button onclick="calcAppend('sin(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">sin</button>
                        <button onclick="calcAppend('cos(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">cos</button>
                        <button onclick="calcAppend('tan(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">tan</button>
                        <button onclick="calcAppend('(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">(</button>
                        <button onclick="calcAppend(')')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">)</button>
                        <button onclick="calcAppend('log(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">log</button>
                        <button onclick="calcAppend('ln(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">ln</button>
                        <button onclick="calcAppend('√(')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">√</button>
                        <button onclick="calcAppend('π')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">π</button>
                        <button onclick="calcAppend('^')" class="py-1 rounded-xl skin-btn text-sm font-bold border btn-active">xʸ</button>
                    </div>

                    <!-- 標準數字與算術按鈕 -->
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="calcClear()" class="py-1 rounded-xl skin-btn font-bold text-2xl border btn-active text-red-400">AC</button>
                        <button onclick="calcDelete()" class="py-1 rounded-xl skin-btn font-bold text-2xl border btn-active flex items-center justify-center"><i data-lucide="delete" class="w-5 h-5"></i></button>
                        <button onclick="calcAppend('%')" class="py-1 rounded-xl skin-btn font-bold text-2xl border btn-active">%</button>
                        <button onclick="calcAppend('/')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active skin-accent-text">÷</button>

                        <button onclick="calcAppend('7')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">7</button>
                        <button onclick="calcAppend('8')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">8</button>
                        <button onclick="calcAppend('9')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">9</button>
                        <button onclick="calcAppend('*')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active skin-accent-text">×</button>

                        <button onclick="calcAppend('4')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">4</button>
                        <button onclick="calcAppend('5')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">5</button>
                        <button onclick="calcAppend('6')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">6</button>
                        <button onclick="calcAppend('-')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active skin-accent-text">-</button>

                        <button onclick="calcAppend('1')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">1</button>
                        <button onclick="calcAppend('2')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">2</button>
                        <button onclick="calcAppend('3')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">3</button>
                        <button onclick="calcAppend('+')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active skin-accent-text">+</button>

                        <button onclick="calcAppend('00')" class="py-1 rounded-xl skin-btn font-bold text-2xl border btn-active">00</button>
                        <button onclick="calcAppend('0')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">0</button>
                        <button onclick="calcAppend('.')" class="py-1 rounded-xl skin-btn font-bold text-3xl border btn-active">.</button>
                        <button onclick="calcCompute()" class="py-1 rounded-xl skin-accent-bg font-black text-3xl shadow-xl btn-active" style="box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 15px -3px rgba(0,0,0,0.15);">=</button>
                    </div>
                </div>
            </div>

            <!-- 2. 換算功能網格頁面 -->
            <div id="panel-convert-menu" class="hidden flex-1 flex flex-col overflow-hidden p-3">
                <div id="converter-grid" class="grid grid-cols-3 gap-2 flex-1 overflow-y-auto no-scrollbar pb-2 content-start"></div>
            </div>

            <!-- 3. 換算功能具體頁面 (含大標題、大選單、3 行輸入框與說明卡) -->
            <div id="panel-converter-detail" class="hidden flex-1 flex flex-col overflow-hidden">
                <div class="px-6 pt-3 pb-1 flex justify-between items-center text-base skin-sub">
                    <span id="converter-subtitle" class="font-extrabold text-lg"></span>
                    <span id="api-status" class="hidden flex items-center gap-1.5 text-emerald-400 font-bold"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span> <span id="api-status-text">即時 API 已連線</span></span>
                </div>
                <div id="converter-content" class="flex-1 overflow-y-auto no-scrollbar px-6 pb-6 space-y-4"></div>
            </div>

        </div>

    </div>

    <!-- 5 款皮膚選擇 Modal -->
    <div id="theme-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-50 flex items-center justify-center p-6 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="skin-card rounded-[2.5rem] p-6 w-full max-w-sm border skin-border flex flex-col gap-4 shadow-2xl transform scale-95 transition-transform duration-300" id="theme-modal-content">
            <div class="flex items-center justify-between pb-2 border-b skin-border">
                <h3 class="text-xl font-extrabold flex items-center gap-2">
                    <i data-lucide="palette" class="w-6 h-6 skin-accent-text"></i>
                    <span>選擇專屬皮膚</span>
                </h3>
                <button onclick="toggleThemeModal()" class="p-2 skin-sub hover:skin-text"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="setTheme('theme-aurora')" class="p-4 rounded-2xl bg-slate-800 text-slate-100 font-bold border border-sky-400/50 flex justify-between items-center text-lg btn-active">
                    <span>🌟 極光暮光 (Aurora Pro)</span>
                    <span class="w-4 h-4 rounded-full bg-sky-400"></span>
                </button>
                <button onclick="setTheme('theme-latte')" class="p-4 rounded-2xl bg-[#fff8f0] text-[#54382b] font-bold border border-[#ffaa8a] flex justify-between items-center text-lg btn-active">
                    <span>🌸 櫻花拿鐵 (Warm Latte)</span>
                    <span class="w-4 h-4 rounded-full bg-[#ffaa8a]"></span>
                </button>
                <button onclick="setTheme('theme-ocean')" class="p-4 rounded-2xl bg-[#f0f8ff] text-[#0f4c81] font-bold border border-[#007aff] flex justify-between items-center text-lg btn-active">
                    <span>🌊 蔚藍海浪 (Ocean Breeze)</span>
                    <span class="w-4 h-4 rounded-full bg-[#007aff]"></span>
                </button>
                <button onclick="setTheme('theme-forest')" class="p-4 rounded-2xl bg-[#f4f7f5] text-[#1b4332] font-bold border border-[#40916c] flex justify-between items-center text-lg btn-active">
                    <span>🌲 極簡森系 (Forest Zen)</span>
                    <span class="w-4 h-4 rounded-full bg-[#40916c]"></span>
                </button>
                <button onclick="setTheme('theme-neon')" class="p-4 rounded-2xl bg-black text-indigo-200 font-bold border border-purple-500 flex justify-between items-center text-lg btn-active">
                    <span>💎 星空極致 (Cyber Neon)</span>
                    <span class="w-4 h-4 rounded-full bg-purple-500"></span>
                </button>
                <button onclick="setTheme('theme-oled')" class="p-4 rounded-2xl bg-black text-white font-bold border border-gray-500 flex justify-between items-center text-lg btn-active">
                    <span>⚫ OLED 純黑 (True Black)</span>
                    <span class="w-4 h-4 rounded-full bg-white border border-gray-600"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-50 flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="skin-card rounded-[2.5rem] w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden border skin-border transform scale-95 transition-transform duration-300" id="history-modal-content">
            <div class="flex items-center justify-between p-5 border-b skin-border">
                <h3 id="hist-title" class="font-extrabold text-xl skin-text">計算歷史紀錄</h3>
                <button onclick="closeHistoryModal()" class="skin-sub skin-btn p-2 rounded-full border"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-4 border-t skin-border flex justify-between items-center skin-card">
                <button onclick="clearHistory()" id="hist-clear" class="text-red-400 text-base font-bold hover:underline px-2 py-1">清除全部</button>
                <button onclick="closeHistoryModal()" id="hist-close" class="skin-accent-bg px-6 py-2.5 rounded-xl text-base font-bold shadow-md btn-active">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast 複製提示浮窗 -->
    <div id="custom-toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 skin-accent-bg px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 text-base font-bold tracking-wide"></div>

    <script>
        // 14 國語言字典包
        const i18n = {
            'zh-TW': { 
                calc: '計算', convert: '換算', sci: '科學', std: '標準',
                cat_sci: '度量衡', cat_life: '生活', cat_fin: '金融', cat_time: '時間', cat_pro: '專業', cat_all: '全部',
                length: '長度', weight: '重量', area: '面積', volume: '體積', temp: '溫度', speed: '速度',
                fuel: '車輛油耗', bmi: 'BMI 計算', shoes: '服飾鞋碼', cooking: '烹飪烘焙',
                currency: '匯率轉換', travel: '旅遊購物', compound: '複利定額', discount: '折扣計算', tip: '小費分帳', mortgage: '房貸計算',
                lunar: '農曆國曆', time: '時間轉換', date: '日期計算', date_target: '目標日期', age: '精確年齡',
                data: '數據儲存', base: '進制轉換', color: '色彩代碼', chineseNum: '大寫數字',
                history: '歷史紀錄', clear: '清除', close: '關閉', noHistory: '暫無紀錄', copied: '已複製數值' 
            },
            'zh-CN': { 
                calc: '计算', convert: '换算', sci: '科学', std: '标准',
                cat_sci: '度量衡', cat_life: '生活', cat_fin: '金融', cat_time: '时间', cat_pro: '专业', cat_all: '全部',
                length: '长度', weight: '重量', area: '面积', volume: '体积', temp: '温度', speed: '速度',
                fuel: '车辆油耗', bmi: 'BMI', shoes: '服饰鞋码', cooking: '烹饪烘焙',
                currency: '汇率转换', travel: '旅游购物', compound: '复利定额', discount: '折扣', tip: '小费', mortgage: '房贷',

        /* ===== 計算機引擎邏輯 ===== */
        let calcInput = '0';

        function updateCalcDisplay() {
            document.getElementById('calc-display').innerText = calcInput;
            document.getElementById('calc-history-exp').innerText = calcHistoryExp;
        }

        function calcAppend(val) {
            if (isEquationComplete) {
                if (['+', '-', '*', '/', '%', '^'].includes(val)) {
                    calcInput += val;
                } else {
                    calcInput = val;
                }
                calcHistoryExp = '';
                isEquationComplete = false;
                updateCalcDisplay();
                return;
            }

            if (calcInput === '0' && !['+', '-', '*', '/', '%', '.', '^'].includes(val)) calcInput = val;
            else calcInput += val;
            updateCalcDisplay();
        }

        function calcClear() { calcInput = '0'; calcHistoryExp = ''; isEquationComplete = false; updateCalcDisplay(); }
        function calcDelete() { 
            if (isEquationComplete) return;
            calcInput = calcInput.length > 1 ? calcInput.slice(0, -1) : '0'; 
            updateCalcDisplay(); 
        }

        function calcCompute() {
            try {
                let expr = calcInput.replace(/×/g, '*').replace(/÷/g, '/');
                expr = expr.replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                           .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                           .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                           .replace(/log\(/g, 'Math.log10(')
                           .replace(/ln\(/g, 'Math.log(')
                           .replace(/√\(/g, 'Math.sqrt(')
                           .replace(/π/g, 'Math.PI')
                           .replace(/e/g, 'Math.E')
                           .replace(/\^/g, '**');

                let openCount = (expr.match(/\(/g) || []).length;
                let closeCount = (expr.match(/\)/g) || []).length;
                expr += ')'.repeat(Math.max(0, openCount - closeCount));

                let result = Function('"use strict";return (' + expr + ')')();
                if(!isFinite(result) || isNaN(result)) throw new Error("Err");
                result = Number.isInteger(result) ? result.toString() : parseFloat(result.toFixed(8)).toString();

                let record = `${calcInput.replace(/\*/g, '×').replace(/\//g, '÷')} = ${result}`;
                historyRecords.unshift(record);
                if (historyRecords.length > 30) historyRecords.pop();
                localStorage.setItem('calc_history_data', JSON.stringify(historyRecords));

                calcHistoryExp = calcInput.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                calcInput = result;
                isEquationComplete = true;
                updateCalcDisplay();
            } catch (e) { showToast('算式運算錯誤'); }
        }

        function copyDisplay() {
            let textToCopy = calcInput;
            if (calcHistoryExp) {
                textToCopy = calcHistoryExp + ' ' + calcInput;
            }
            const el = document.createElement('textarea');
            el.value = textToCopy;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('已複製成功');
        }

        /* ===== 單位與換算對照比例數據 ===== */
        const unitData = {
            length: { units: { m: '公尺 (m)', km: '公里 (km)', cm: '公分 (cm)', mm: '公釐 (mm)', mi: '英里 (mi)', yd: '碼 (yd)', ft: '英尺 (ft)', in: '英吋 (in)' }, ratios: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.34, yd: 0.9144, ft: 0.3048, in: 0.0254 } },
            weight: { units: { kg: '公斤 (kg)', g: '公克 (g)', t: '公噸 (t)', lb: '磅 (lb)', oz: '盎司 (oz)', jin_tw: '台斤', liang_tw: '台兩' }, ratios: { kg: 1, g: 0.001, t: 1000, lb: 0.453592, oz: 0.028349, jin_tw: 0.6, liang_tw: 0.0375 } },
            area: { units: { sqm: '平方公尺', sqkm: '平方公里', ha: '公頃', a: '公畝', acre: '英畝', ping: '坪', jia: '甲', sqft: '平方英尺' }, ratios: { sqm: 1, sqkm: 1e6, ha: 10000, a: 100, acre: 4046.85, ping: 3.30578, jia: 9699.17, sqft: 0.0929 } },
            volume: { units: { l: '公升 (L)', ml: '毫升 (mL)', cubm: '立方公尺', gal: '加侖 (gal)', oz: '液體盎司' }, ratios: { l: 1, ml: 0.001, cubm: 1000, gal: 3.785, oz: 0.02957 } },
            speed: { units: { kmh: '公里/時', ms: '公尺/秒', mph: '英里/時', knot: '節', mach: '馬赫' }, ratios: { kmh: 1, ms: 3.6, mph: 1.609, knot: 1.852, mach: 1225 } },
            data: { units: { b: 'Byte', kb: 'KB', mb: 'MB', gb: 'GB', tb: 'TB' }, ratios: { b: 1, kb: 1024, mb: 1048576, gb: 1073741824, tb: 1099511627776 } },
            time: { units: { yr: '年', mon: '月', d: '天', h: '小時', min: '分鐘', s: '秒' }, ratios: { yr: 31536000, mon: 2628000, d: 86400, h: 3600, min: 60, s: 1 } },
            shoes: { units: { jp: 'JP (公分)', us: 'US (男/中性)', uk: 'UK', eu: 'EU (歐碼)' }, ratios: { jp: 1, us: 1, uk: 1, eu: 1 } },
            fuel: { units: { kml: 'km/L', l100: 'L/100km', mpg: 'MPG(US)' }, ratios: { kml: 1, l100: 1, mpg: 1 } },
            cooking: { units: { cup: '杯 (Cup 240ml)', tbsp: '大匙 (Tbsp)', tsp: '小匙 (Tsp)', ml: '液體毫升 (ml)', flour_g: '麵粉 (g)', sugar_g: '糖 (g)' }, ratios: { ml: 1, cup: 240, tbsp: 15, tsp: 5, flour_g: 1.92, sugar_g: 1.2 } }
        };

        function generateOptions(unitsObj, isCurrency = false) {
            if (isCurrency) {

                html += `<option disabled>──────────</option>`;

            }
            return Object.keys(unitsObj).map(k => `<option value="${k}">${unitsObj[k]}</option>`).join('');

            return `

        function do3RowConvert(type, sourceIndex) {
            const vals = [document.getElementById('val-1'), document.getElementById('val-2'), document.getElementById('val-3')];
            const sels = [document.getElementById('sel-1')?.value, document.getElementById('sel-2')?.value, document.getElementById('sel-3')?.value];
            const sourceInput = vals[sourceIndex - 1];
            if (!sourceInput) return;

            let num = parseFloat(sourceInput.value);
            if (isNaN(num)) { vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = ''; }); return; }

            if (type === 'currency') {
                let baseUSD = num / (currencyRates[sels[sourceIndex - 1]] || 1);
                vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) { let r = baseUSD * (currencyRates[sels[idx]] || 1); v.value = r > 10 ? r.toFixed(2) : r.toFixed(4); }});
            } else if (type === 'temp') {
                let baseC = sels[sourceIndex - 1] === 'c' ? num : (sels[sourceIndex - 1] === 'f' ? (num - 32) * 5/9 : num - 273.15);
                vals.forEach((v, idx) => {
                    if (idx !== sourceIndex - 1) {
                        let t = sels[idx]; v.value = (t === 'c' ? baseC : (t === 'f' ? (baseC * 9/5) + 32 : baseC + 273.15)).toFixed(2);
                    }
                });
            } else if (type === 'base') {
                let bases = { dec: 10, bin: 2, hex: 16, oct: 8 };
                try {
                    let dec = parseInt(sourceInput.value, bases[sels[sourceIndex - 1]]); if (isNaN(dec)) throw new Error();
                    vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = dec.toString(bases[sels[idx]]).toUpperCase(); });
                } catch(e) { vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = 'Err'; }); }
            } else if (type === 'fuel') {
                let kml = sels[sourceIndex-1] === 'kml' ? num : (sels[sourceIndex-1] === 'l100' ? (num===0?0:100/num) : num/2.35215);
                vals.forEach((v, idx) => {
                    if(idx !== sourceIndex-1) {
                        let t = sels[idx]; v.value = (t === 'kml' ? kml : (t === 'l100' ? (kml===0?0:100/kml) : kml*2.35215)).toFixed(2);
                    }
                });
            } else if (type === 'shoes') {
                let jp = sels[sourceIndex-1] === 'jp' ? num : (sels[sourceIndex-1] === 'us' ? num+18 : (sels[sourceIndex-1] === 'uk' ? num+18.5 : ((num-4)/1.5 - 1.5)));
                vals.forEach((v, idx) => {
                    if(idx !== sourceIndex-1) {
                        let t = sels[idx]; v.value = (t === 'jp' ? jp : (t === 'us' ? jp-18 : (t === 'uk' ? jp-18.5 : (jp+1.5)*1.5+4))).toFixed(1);
                    }
                });
            } else {
                let baseValue = num * unitData[type].ratios[sels[sourceIndex - 1]];
                vals.forEach((v, idx) => {
                    if (idx !== sourceIndex - 1) {
                        let res = baseValue / unitData[type].ratios[sels[idx]];
                        v.value = (res < 0.0001 || res > 9999999) && res !== 0 ? res.toExponential(4) : parseFloat(res.toFixed(6));
                    }
                });
            }
        }

        // 各工具運算函式
        function calcDiscount() {
            let price = parseFloat(document.getElementById('dc-price').value) || 0;
            let discount = parseFloat(document.getElementById('dc-discount').value) || 100;
            let rate = discount > 10 ? discount / 100 : discount / 10;
            let finalPrice = Math.round(price * rate);
            let saved = price - finalPrice;
            document.getElementById('dc-final').innerText = `$${finalPrice.toLocaleString()}`;
            document.getElementById('dc-saved').innerText = `$${saved.toLocaleString()}`;
        }

        function calcTip() {
            let amount = parseFloat(document.getElementById('tip-amount').value) || 0;
            let rate = (parseFloat(document.getElementById('tip-rate').value) || 0) / 100;
            let people = Math.max(1, parseInt(document.getElementById('tip-people').value) || 1);
            let tip = Math.round(amount * rate);
            let total = amount + tip;
            let perPerson = Math.round(total / people);
            document.getElementById('tip-per-person').innerText = `$${perPerson.toLocaleString()}`;
            document.getElementById('tip-total').innerText = `$${total.toLocaleString()}`;
        }

        function calcBMI() {
            let h = parseFloat(document.getElementById('bmi-h').value) / 100, w = parseFloat(document.getElementById('bmi-w').value);
            if (!h || !w || h <= 0) return; let bmi = (w / (h * h)).toFixed(1); document.getElementById('bmi-val').innerText = bmi;
            let st = document.getElementById('bmi-status');
            if (bmi < 18.5) { st.innerText = '過輕 (<18.5)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-amber-500/20 text-amber-400 mt-1'; }
            else if (bmi < 24) { st.innerText = '正常 (18.5-24)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-emerald-500/20 text-emerald-400 mt-1'; }
            else if (bmi < 27) { st.innerText = '過重 (24-27)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-orange-500/20 text-orange-400 mt-1'; }
            else { st.innerText = '肥胖 (≥27)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-red-500/20 text-red-400 mt-1'; }
        }

        function calcMortgage() {
            let p = (parseFloat(document.getElementById('mg-amount').value)||0)*10000, r = (parseFloat(document.getElementById('mg-rate').value)||0)/100/12, n = (parseFloat(document.getElementById('mg-years').value)||0)*12;
            if (p<=0||r<=0||n<=0) { document.getElementById('mg-result').innerText = '$0'; return; }
            document.getElementById('mg-result').innerText = `$${Math.round((p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1)).toLocaleString()}`;
        }

        function calcCompound() {
            let p = parseFloat(document.getElementById('cp-init').value)||0, m = parseFloat(document.getElementById('cp-month').value)||0, r = (parseFloat(document.getElementById('cp-rate').value)||0)/100/12, n = (parseFloat(document.getElementById('cp-years').value)||0)*12;
            let future = p * Math.pow(1+r, n) + m * ((Math.pow(1+r, n) - 1) / r);
            document.getElementById('cp-total').innerText = `$${Math.round(future).toLocaleString()}`;
        }

        function calcTravel() {
            let amt = parseFloat(document.getElementById('tvl-amt').value)||0;
            let foreign = document.getElementById('tvl-foreign').value;
            let home = document.getElementById('tvl-home').value;
            let baseUSD = amt / (currencyRates[foreign] || 1);
            let homeVal = baseUSD * (currencyRates[home] || 1);
            document.getElementById('tvl-res').innerText = homeVal < 100 ? homeVal.toFixed(2) : Math.round(homeVal).toLocaleString();

            const table = document.getElementById('tvl-table');
            const amounts = [100, 500, 1000, 5000, 10000];
            table.innerHTML = amounts.map(a => {
                let v = (a / (currencyRates[foreign]||1)) * (currencyRates[home]||1);
                let fv = v < 100 ? v.toFixed(2) : Math.round(v).toLocaleString();
                return `<div class="flex justify-between border-b skin-border py-1.5"><span class="skin-sub">${a}</span><span class="font-extrabold skin-text">${fv}</span></div>`;
            }).join('');
        }

        function calcLunar() {
            let d = new Date(document.getElementById('lunar-in').value);
            if(isNaN(d)) return;
            const weeks = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('lun-week').innerText = weeks[d.getDay()];
            const zodiac = ['摩羯座', '水瓶座', '雙魚座', '牡羊座', '金牛座', '雙子座', '巨蟹座', '獅子座', '處女座', '天秤座', '天蠍座', '射手座', '摩羯座'];
            const days = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            let m = d.getMonth() + 1, day = d.getDate();
            document.getElementById('lun-zodiac').innerText = day < days[m - 1] ? zodiac[m - 1] : zodiac[m];
            try {
                if(typeof Solar !== 'undefined') {
                    let solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, d.getDate());
                    let lunar = solar.getLunar();
                    document.getElementById('lun-y').innerText = `${lunar.getYearInGanZhi()}年 (${lunar.getYearShengXiao()}年)`;
                    document.getElementById('lun-md').innerText = `${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                }
            } catch(e) {}
        }

        function calcDate() {
            let d1 = new Date(document.getElementById('date-start').value), d2 = new Date(document.getElementById('date-end').value);
            if(!isNaN(d1) && !isNaN(d2)) document.getElementById('date-result').innerText = `${Math.ceil(Math.abs(d2 - d1) / 86400000)} 天`;
        }

        function calcDateTarget() {
            let d = new Date(document.getElementById('dt-start').value), days = parseInt(document.getElementById('dt-days').value)||0;
            if(!isNaN(d)) { d.setDate(d.getDate() + days); document.getElementById('dt-result').innerText = d.toISOString().split('T')[0]; }
        }

        function calcAge() {
            let b = new Date(document.getElementById('age-birth').value), now = new Date();
            if(isNaN(b) || b > now) return;
            let y = now.getFullYear() - b.getFullYear(), m = now.getMonth() - b.getMonth(), d = now.getDate() - b.getDate();
            if (d < 0) { m--; let prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); }
            if (m < 0) { y--; m += 12; }
            document.getElementById('age-y').innerText = y; document.getElementById('age-m').innerText = m; document.getElementById('age-d').innerText = d;
            let next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
            if(now > next) next.setFullYear(now.getFullYear()+1);
            document.getElementById('age-next').innerText = `${Math.ceil((next - now) / 86400000)} 天`;
        }

        function calcColor(source) {
            let hex = document.getElementById('col-hex'), rgb = document.getElementById('col-rgb');
            if (source === 'hex') {
                let h = hex.value.replace('#', '');
                if(h.length === 3) h = h.split('').map(x=>x+x).join('');
                if(h.length === 6) {
                    let r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
                    rgb.value = `${r}, ${g}, ${b}`; document.getElementById('col-preview').style.backgroundColor = `#${h}`;
                }
            } else {
                let parts = rgb.value.split(',').map(x=>parseInt(x.trim()));
                if(parts.length===3 && !parts.some(isNaN)) {
                    let h = '#' + parts.map(x=>{let s = Math.max(0,Math.min(255,x)).toString(16); return s.length===1?'0'+s:s;}).join('').toUpperCase();
                    hex.value = h; document.getElementById('col-preview').style.backgroundColor = h;
                }
            }
        }

        function convertChineseNum() {
            const numStr = document.getElementById('cnum-in').value;
            if(!numStr) { document.getElementById('cnum-out').innerText = '零'; return; }
            const chars = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'], units = ['','拾','佰','仟','萬','拾','佰','仟','億','拾','佰','仟'];
            let res = '', zeroFlag = false, strRev = numStr.split('').reverse().join('');
            for(let i=0; i<strRev.length; i++) {
                let d = parseInt(strRev[i]);
                if (d===0) { if(i===4)res='萬'+res; else if(i===8)res='億'+res; zeroFlag = true; }
                else { if(zeroFlag && i!==4 && i!==8)res='零'+res; res=chars[d]+units[i]+res; zeroFlag=false; }
            }
            document.getElementById('cnum-out').innerText = res.replace(/零萬/g,'萬').replace(/零億/g,'億').replace(/億萬/g,'億').replace(/零+$/,'') || '零';
        }

        function copyText(id) {
            const el = document.createElement('textarea'); el.value = document.getElementById(id).innerText;
            document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            const txt = i18n[currentLang] || i18n['zh-TW'];
            showToast(txt.copied || '已複製數值');
        }

        /* ===== Modal 控制 ===== */
        function openHistoryModal() {
            const list = document.getElementById('history-list');
            const txt = i18n[currentLang] || i18n['zh-TW'];
            list.innerHTML = historyRecords.length ? historyRecords.map(item => {
                const safeFormula = item.replace(/"/g, '&quot;');
                return `
                    <div class="history-item skin-card p-4 rounded-2xl font-mono skin-text text-right text-lg cursor-pointer border skin-border hover:opacity-80 transition-opacity btn-active" data-formula="${safeFormula}" title="點擊複製整條算式">
                        ${item}
                    </div>
                `;
            }).join('') : `<div class="text-center skin-sub py-10 font-bold text-lg">${txt.noHistory || '暫無紀錄'}</div>`;
            
            list.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    const formula = el.dataset.formula;
                    const doCopy = (text) => {
                        if (navigator.clipboard && window.isSecureContext) {
                            return navigator.clipboard.writeText(text);
                        }
                        return new Promise((resolve) => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            ta.style.position = 'fixed';
                            ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand('copy'); } catch (e) {}
                            document.body.removeChild(ta);
                            resolve();
                        });
                    };
                    doCopy(formula).then(() => {
                        showToast('已複製成功');
                    });
                });
            });
            
            const modal = document.getElementById('history-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('history-modal-content').classList.remove('scale-95');
            }, 10);
            refreshIcons();
        }

        function closeHistoryModal() { 
            document.getElementById('history-modal-content').classList.add('scale-95');
            const modal = document.getElementById('history-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function clearHistory() { historyRecords = []; localStorage.removeItem('calc_history_data'); openHistoryModal(); }

        function showToast(msg) {
            const t = document.getElementById('custom-toast'); t.innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2000);
        }
    </script>

    <!-- PWA Service Worker 註冊（部署到 HTTP/HTTPS 後自動啟用離線快取） -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('✅ SW registered:', reg.scope))
                    .catch((err) => console.log('❌ SW failed:', err));
            });
        }
    </script>
</body>
