    <title>超級計算與換算 App Pro Max ☕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJS (科學計算引擎) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.4.4/math.min.js"></script>
    <!-- Lucide Icons -->

    <!-- Lunar JS (農曆萬年曆引擎) -->

    <style>
        html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        input, textarea { user-select: text; -webkit-user-select: text; }
        .panel-enter { animation: panelFadeIn 0.3s ease-out; }
        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body, html { height: 100%; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ===== 5 款質感皮膚變數 ===== */
        :root.theme-aurora {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent: #38bdf8; --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
            --border-color: #334155; --btn-bg: #334155; --btn-text: #f8fafc; --note-bg: #0f172a;
        }
        :root.theme-latte {
            --bg-main: #fff8f0; --bg-card: #ffffff; --text-main: #54382b; --text-sub: #9c8275;
            --accent: #e07a5f; --accent-gradient: linear-gradient(135deg, #f2cc8f 0%, #e07a5f 100%);
            --border-color: #f4e4ba; --btn-bg: #fff8eb; --btn-text: #54382b; --note-bg: #fef3e2;
        }
        :root.theme-ocean {
            --bg-main: #f0f8ff; --bg-card: #ffffff; --text-main: #0f4c81; --text-sub: #0284c7;
            --accent: #0284c7; --accent-gradient: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            --border-color: #bae6fd; --btn-bg: #e0f2fe; --btn-text: #0369a1; --note-bg: #e0f2fe;
        }
        :root.theme-forest {
            --bg-main: #f4f7f5; --bg-card: #ffffff; --text-main: #1b4332; --text-sub: #2d6a4f;
            --accent: #40916c; --accent-gradient: linear-gradient(135deg, #16a34a 0%, #4ade80 100%);
            --border-color: #b7e4c7; --btn-bg: #e8f0ec; --btn-text: #1b4332; --note-bg: #dcfce7;
        }
        :root.theme-neon {
            --bg-main: #050505; --bg-card: #18181b; --text-main: #f4f4f5; --text-sub: #a1a1aa;
            --accent: #c084fc; --accent-gradient: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            --border-color: #27272a; --btn-bg: #27272a; --btn-text: #f4f4f5; --note-bg: #18181b;
        }
        :root.theme-oled {
            --bg-main: #000000; --bg-card: #0a0a0a; --text-main: #ffffff; --text-sub: #737373;
            --accent: #ffffff; --accent-gradient: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            --border-color: #1f1f1f; --btn-bg: #1a1a1a; --btn-text: #ffffff; --note-bg: #0a0a0a;
        }

        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }
        .skin-card { background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main); }
        .skin-sub { color: var(--text-sub); }
        .skin-btn { background-color: var(--btn-bg); color: var(--btn-text); border-color: var(--border-color); }
        .skin-accent-bg { background: var(--accent-gradient); color: #ffffff; }
        .skin-accent-text { color: var(--accent); }
        .skin-border { border-color: var(--border-color); }
        .skin-note { background-color: var(--note-bg); border-color: var(--border-color); }
        .btn-active:active { transform: scale(0.96); opacity: 0.85; }

        select { background: transparent; color: inherit; }
        option { background-color: var(--bg-card); color: var(--text-main); }

        /* ===== v4：跨平台一致版面（Android / iOS 統一） ===== */
        :root {
            --vh100: 100vh;
            --app-h: 100vh;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --gap: 6px;
            /* 按鍵高度只跟「螢幕高度」有關，兩平台完全一致 */
            --key-h: clamp(52px, calc(var(--vh100) * 0.095), 82px);
            --sci-h: clamp(32px, calc(var(--vh100) * 0.052), 46px);
            --fs-key: clamp(30px, 9.2vw, 42px);
        }
        @supports (height: 100dvh) {
            :root { --vh100: 100dvh; --app-h: 100dvh; }
        }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: var(--app-h); overflow: hidden; overscroll-behavior: none; }
        .app-shell { height: var(--app-h); max-height: var(--app-h); }

        /* 計算頁三段式：品牌列(固定) / 顯示區(彈性) / 鍵盤(固定) */
        .brand-row { flex: 0 0 auto; overflow: hidden; }
        /* 品牌列 / 標題列字級：隨螢幕寬度縮放，320px 小螢幕也不會重疊 */
        .brand-name { font-size: clamp(14px, 4.5vw, 16.5px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .brand-sub { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .brand-btn { font-size: clamp(11.5px, 3.6vw, 13.5px); }
        .main-tab-text { font-size: clamp(21px, 7.2vw, 27px); }
        .lang-wrap { width: clamp(106px, 35vw, 138px); flex: 0 0 auto; }
        .lang-select { font-size: clamp(12.5px, 4vw, 15px); }
        .display-area { flex: 1 1 auto; min-height: var(--disp-min, 108px); overflow: hidden; }
        /* 科學面板展開時仍保留算式與結果的空間，靠 JS 縮列高而不是互相遮蓋 */
        .keypad { flex: 0 0 auto; }

        /* 算式列：單行、縮短高度、超出以省略號收尾 */
        #calc-history-exp {
            width: 100%; max-width: 100%; flex: 0 0 auto;
            white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis;
            word-break: keep-all !important; overflow-wrap: normal !important;
            font-size: clamp(15px, 4.7vw, 19px);
            line-height: 1.25; letter-spacing: 0.02em;
            min-height: 1.25em;
        }
        /* 結果列：單行不換行，字級由 JS 自動縮放到剛好貼合寬度 */
        .disp-wrap {
            width: 100%; flex: 0 0 auto; overflow: hidden;
            display: flex; justify-content: flex-end;
        }
        #calc-display {
            flex: 0 0 auto; white-space: nowrap;
            font-size: clamp(38px, 15vw, 60px);
            line-height: 1.14; letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .keypad { flex: 0 0 auto; }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: var(--key-h);
            gap: var(--gap);
        }
        .keypad-grid > button {
            width: 100%; height: 100%; min-width: 0; padding: 0; margin: 0;
            display: flex; align-items: center; justify-content: center;
            line-height: 1; font-size: var(--fs-key);
            border-radius: 16px; overflow: hidden;
        }
        .sci-grid {
            display: none;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-auto-rows: var(--sci-h);
            gap: var(--gap);
        }
        .sci-grid:not(.hidden) { display: grid; }
        .sci-grid > button {
            width: 100%; height: 100%; min-width: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            line-height: 1; font-size: clamp(14px, 4.2vw, 18px);
            border-radius: 12px;
        }

        // 版面自適應：算式與結果同字級，靠實測反推按鍵列高，任何機型都不溢出
        function layoutFit() {
            const shell = document.querySelector('.app-shell');
            const panel = document.getElementById('panel-calc');
            if (!shell || !panel || panel.classList.contains('hidden')) return;
            const root = document.documentElement;
            const grid = document.querySelector('.keypad-grid');
            const kp = document.querySelector('.keypad');
            if (!grid || !kp) return;
            if (!shell.clientHeight) return;

            const gap = parseFloat(getComputedStyle(grid).rowGap) || 6;
            const gw = grid.getBoundingClientRect().width || 0;
            const keyW = gw ? (gw - 3 * gap) / 4 : 84;
            const khMax = Math.max(36, Math.min(96, Math.round(keyW * 1.08)));
            const padY = 12;
            const vw = Math.min(window.innerWidth || 375, 520);
            const capFs = Math.max(40, Math.min(84, Math.round(vw * 0.22)));
            root.style.removeProperty('--sci-h');

            // 用「鍵盤底 − 面板底」判斷溢出：面板做進場動畫時 transform 會一起位移，兩者相減可抵銷
            function overflowPx() {
                return kp.getBoundingClientRect().bottom - panel.getBoundingClientRect().bottom;
            }

            // 顯示區最小高度 = 算式列 + 結果列（同字級），鍵高從上限往下收，收到剛好不溢出
            const expEl = document.getElementById('calc-history-exp');
            function applyFit(fs) {
                const expH = expEl ? Math.ceil(expEl.getBoundingClientRect().height) : 22;
                const dispMin = expH + Math.ceil(fs * 1.18) + padY;
                root.style.setProperty('--disp-min', dispMin + 'px');
                root.style.setProperty('--calc-max-fs', fs + 'px');
                let kh = khMax;
                root.style.setProperty('--key-h', kh + 'px');
                let guard = 0;
                while (guard++ < 90 && kh > 32 && overflowPx() > 0.5) {
                    kh -= 1;
                    root.style.setProperty('--key-h', kh + 'px');
                }
                root.style.setProperty('--fs-key', Math.max(22, Math.min(42, Math.round(kh * 0.55))) + 'px');
                return { fits: overflowPx() <= 0.5, kh: kh, dispMin: dispMin };
            }

            let fs = capFs;
            let r = applyFit(fs);
            let guard2 = 0;
            while (!r.fits && fs > 30 && guard2++ < 12) {
                fs -= 4;
                r = applyFit(fs);
            }
            // 小螢幕（如 320×480）開科學面板仍塞不下時，再壓科學列高
            if (!r.fits) {
                const sci = document.getElementById('scientific-pad');
                if (sci && !sci.classList.contains('hidden')) {
                    const steps = [40, 36, 32, 28, 26];
                    for (let i = 0; i < steps.length; i++) {
                        root.style.setProperty('--sci-h', steps[i] + 'px');
                        r = applyFit(fs);
                        if (r.fits) break;
                    }
                }
            }

            fitCalcText();

            // 結果字級被寬度縮小後，顯示區可再收一點，把空間還給按鍵
            const real = parseFloat(document.getElementById('calc-display').style.fontSize) || fs;
            if (real < fs - 1) {
                applyFit(real);
                fitCalcText();
            }
        }

        // 結果文字自動縮放：永遠單行、不出界、不斷行
        function fitCalcText() {
            const el = document.getElementById('calc-display');
            if (!el) return;
            const area = el.closest('.display-area');
            const expEl = document.getElementById('calc-history-exp');
            const rootStyle = getComputedStyle(document.documentElement);
            const vw = Math.min(window.innerWidth || 375, 520);
            const capFs = parseFloat(rootStyle.getPropertyValue('--calc-max-fs')) || Math.max(40, Math.min(84, Math.round(vw * 0.22)));
            const avail = el.parentElement.clientWidth;
            if (!avail) return;
            const minFs = 18;
            let fs = Math.round(capFs);
            el.style.fontSize = fs + 'px';
            let guard = 0;
            while (fs > minFs && el.scrollWidth > avail && guard++ < 60) {
                fs -= 2;
                el.style.fontSize = fs + 'px';
            }
            if (area) {
                const padY = 14;
                const expH = expEl ? expEl.offsetHeight : 0;
                const availH = area.clientHeight - expH - padY;
                let g2 = 0;
                while (fs > minFs && el.getBoundingClientRect().height > availH && g2++ < 40) {
                    fs -= 2;
                    el.style.fontSize = fs + 'px';
                }
            }
        }

        function fitTabs() {
            const box = document.getElementById('tab-container');
            if (!box) return;
            const avail = box.parentElement.clientWidth - 4;
            if (!avail) return;
            const kids = [...box.children];
            if (!kids.length) return;
            const cvs = document.createElement('canvas').getContext('2d');
            const fam = getComputedStyle(box).fontFamily;
            const wt = getComputedStyle(kids[0]).fontWeight || '700';
            const texts = kids.map(k => (k.innerText || '').trim());
            box.style.fontSize = '';
            let fs = parseFloat(getComputedStyle(box).fontSize) || 27;
            const need = () => {
                cvs.font = wt + ' ' + fs + 'px ' + fam;
                return texts.reduce((a, t) => a + cvs.measureText(t).width, 0) + 12 * (texts.length - 1) + 4;
            };
            while (fs > 14 && need() > avail) { fs -= 1; box.style.fontSize = fs + 'px'; }
        }

        function fitExpLine() {

        function calcAppend(val) {
            if (isEquationComplete) {
                if (['+', '-', '*', '/', '%', '^'].includes(val)) {
                    calcInput += val;
                } else {
                    calcInput = val;
                }
                calcHistoryExp = '';
                isEquationComplete = false;
                updateCalcDisplay();
                return;
            }

            if (calcInput === '0' && !['+', '-', '*', '/', '%', '.', '^'].includes(val)) calcInput = val;
            else calcInput += val;
            updateCalcDisplay();
        }

        function calcClear() { calcInput = '0'; calcHistoryExp = ''; isEquationComplete = false; updateCalcDisplay(); }
        function calcDelete() { 
            if (isEquationComplete) return;
            calcInput = calcInput.length > 1 ? calcInput.slice(0, -1) : '0'; 
            updateCalcDisplay(); 
        }

        function calcCompute() {
            try {
                let expr = calcInput.replace(/×/g, '*').replace(/÷/g, '/');
                expr = expr.replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                           .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                           .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                           .replace(/log\(/g, 'Math.log10(')
                           .replace(/ln\(/g, 'Math.log(')
                           .replace(/√\(/g, 'Math.sqrt(')
                           .replace(/π/g, 'Math.PI')
                           .replace(/e/g, 'Math.E')
                           .replace(/\^/g, '**');

                let openCount = (expr.match(/\(/g) || []).length;
                let closeCount = (expr.match(/\)/g) || []).length;
                expr += ')'.repeat(Math.max(0, openCount - closeCount));

                let result = Function('"use strict";return (' + expr + ')')();
                if(!isFinite(result) || isNaN(result)) throw new Error("Err");
                result = Number.isInteger(result) ? result.toString() : parseFloat(result.toFixed(8)).toString();

                let record = `${calcInput.replace(/\*/g, '×').replace(/\//g, '÷')} = ${result}`;
                historyRecords.unshift(record);
                if (historyRecords.length > 30) historyRecords.pop();
                localStorage.setItem('calc_history_data', JSON.stringify(historyRecords));

                calcHistoryExp = calcInput.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                calcInput = result;
                isEquationComplete = true;
                updateCalcDisplay();
            } catch (e) { showToast(L('toastErr')); }
        }

        // 複製：先試 Clipboard API，失敗（WebView 無權限等）再退回 execCommand，並回報是否成功
        function copyToClipboard(text) {
            const legacyCopy = () => {
                try {
                    const el = document.createElement('textarea');
                    el.value = text;
                    el.setAttribute('readonly', '');
                    el.style.position = 'fixed';
                    el.style.top = '0';
                    el.style.left = '0';
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    document.body.appendChild(el);
                    el.focus();
                    el.select();
                    el.setSelectionRange(0, text.length);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(el);
                    return !!ok;
                } catch (e) { return false; }
            };
            return new Promise((resolve) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => resolve(true))
                        .catch(() => resolve(legacyCopy()));
                } else {
                    resolve(legacyCopy());
                }
            });
        }

        function copyDisplay() {
            let textToCopy = calcInput;
            if (calcHistoryExp) {
                textToCopy = calcHistoryExp + ' ' + calcInput;
            }
            copyToClipboard(textToCopy).then((ok) => {
                showToast(ok ? L('toastCopy') : L('toastCopyFail'));
            });
        }

        /* ===== 單位與換算對照比例數據 ===== */
        const unitData = {
            length: { units: { m: '公尺 (m)', km: '公里 (km)', cm: '公分 (cm)', mm: '公釐 (mm)', mi: '英里 (mi)', yd: '碼 (yd)', ft: '英尺 (ft)', in: '英吋 (in)' }, ratios: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.34, yd: 0.9144, ft: 0.3048, in: 0.0254 } },

            shoes: { units: { jp: 'JP (公分)', us: 'US (男/中性)', uk: 'UK', eu: 'EU (歐碼)' }, ratios: { jp: 1, us: 1, uk: 1, eu: 1 } },

        function generateOptions(unitsObj, isCurrency = false) {
            if (isCurrency) {

                let html = popular.map(c => currencyRates[c] ? `<option value="${c}">${c}</option>` : '').join('');
                html += `<option disabled>──────────</option>`;
                return html + availableCurrencies.filter(c => !popular.includes(c)).map(c => `<option value="${c}">${c}</option>`).join('');
            }
            return Object.keys(unitsObj).map(k => `<option value="${k}">${unitsObj[k]}</option>`).join('');
        }

        // 讓換算結果數字自動縮到框內，永不裁切、不換行
        const _fitCanvas = document.createElement('canvas');
        function fitValueInputs() {
            const ctx = _fitCanvas.getContext('2d');
            ['val-1', 'val-2', 'val-3'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const cs = getComputedStyle(el);
                const base = 26;
                el.style.fontSize = base + 'px';
                const avail = el.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0) - 2;
                if (avail <= 8) return;
                ctx.font = '800 ' + base + 'px ' + cs.fontFamily;
                const w = ctx.measureText(el.value || '0').width;
                if (w > avail) el.style.fontSize = Math.max(15, Math.floor(base * avail / w)) + 'px';
            });
        }

        function do3RowConvert(type, sourceIndex) {
            const vals = [document.getElementById('val-1'), document.getElementById('val-2'), document.getElementById('val-3')];
            const sels = [document.getElementById('sel-1')?.value, document.getElementById('sel-2')?.value, document.getElementById('sel-3')?.value];
            const sourceInput = vals[sourceIndex - 1];
            if (!sourceInput) return;

            let num = parseFloat(sourceInput.value);
            if (isNaN(num)) { vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = ''; }); return; }

            if (type === 'currency') {
                let baseUSD = num / (currencyRates[sels[sourceIndex - 1]] || 1);
                vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) { let r = baseUSD * (currencyRates[sels[idx]] || 1); v.value = r > 10 ? r.toFixed(2) : r.toFixed(4); }});
            } else if (type === 'temp') {
                let baseC = sels[sourceIndex - 1] === 'c' ? num : (sels[sourceIndex - 1] === 'f' ? (num - 32) * 5/9 : num - 273.15);
                vals.forEach((v, idx) => {
                    if (idx !== sourceIndex - 1) {
                        let t = sels[idx]; v.value = (t === 'c' ? baseC : (t === 'f' ? (baseC * 9/5) + 32 : baseC + 273.15)).toFixed(2);
                    }
                });
            } else if (type === 'base') {
                let bases = { dec: 10, bin: 2, hex: 16, oct: 8 };
                try {
                    let dec = parseInt(sourceInput.value, bases[sels[sourceIndex - 1]]); if (isNaN(dec)) throw new Error();
                    vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = dec.toString(bases[sels[idx]]).toUpperCase(); });
                } catch(e) { vals.forEach((v, idx) => { if (idx !== sourceIndex - 1) v.value = 'Err'; }); }
            } else if (type === 'fuel') {
                let kml = sels[sourceIndex-1] === 'kml' ? num : (sels[sourceIndex-1] === 'l100' ? (num===0?0:100/num) : num/2.35215);
                vals.forEach((v, idx) => {
                    if(idx !== sourceIndex-1) {
                        let t = sels[idx]; v.value = (t === 'kml' ? kml : (t === 'l100' ? (kml===0?0:100/kml) : kml*2.35215)).toFixed(2);
                    }
                });
            } else if (type === 'shoes') {
                let jp = sels[sourceIndex-1] === 'jp' ? num : (sels[sourceIndex-1] === 'us' ? num+18 : (sels[sourceIndex-1] === 'uk' ? num+18.5 : ((num-4)/1.5 - 1.5)));
                vals.forEach((v, idx) => {
                    if(idx !== sourceIndex-1) {
                        let t = sels[idx]; v.value = (t === 'jp' ? jp : (t === 'us' ? jp-18 : (t === 'uk' ? jp-18.5 : (jp+1.5)*1.5+4))).toFixed(1);
                    }
                });
            } else {
                let baseValue = num * unitData[type].ratios[sels[sourceIndex - 1]];
                vals.forEach((v, idx) => {
                    if (idx !== sourceIndex - 1) {
                        let res = baseValue / unitData[type].ratios[sels[idx]];
                        v.value = (res < 0.0001 || res > 9999999) && res !== 0 ? res.toExponential(4) : parseFloat(res.toFixed(6));
                    }
                });
            }
            fitValueInputs();
        }

        function fitConvTitle() {
            const el = document.getElementById('converter-title');

            let guard = 0;
            while (fs > 15 && el.scrollWidth > el.clientWidth + 1 && guard++ < 20) {
                fs -= 1;
                el.style.fontSize = fs + 'px';
            }
        }

            else if (type === 'date' || type === 'date_target') {
                let today = new Date().toISOString().split('T')[0];
                if (type === 'date') {
                    container.innerHTML = `<div class="space-y-4 pt-1">
                        <div class="skin-card p-4 rounded-3xl border skin-border flex justify-between items-center"><span class="font-extrabold skin-sub text-base sm:text-lg">${L('dtStart')}</span><input id="date-start" type="date" value="${today}" onchange="calcDate()" class="bg-transparent text-right font-mono font-extrabold text-xl skin-text focus:outline-none"></div>
                        <div class="skin-card p-4 rounded-3xl border skin-border flex justify-between items-center"><span class="font-extrabold skin-sub text-base sm:text-lg">${L('dtEnd')}</span><input id="date-end" type="date" value="${today}" onchange="calcDate()" class="bg-transparent text-right font-mono font-extrabold text-xl skin-text focus:outline-none"></div>
                        <div class="mt-3 p-6 skin-card rounded-[2.5rem] text-center border skin-border shadow-xl"><div class="text-sm font-bold skin-sub">${L('dtDiff')}</div><div id="date-result" class="text-4xl font-black skin-accent-text my-2 font-mono">0 天</div></div>
                        ${renderNoteCard('date')}
                    </div>`; calcDate();
                } else {
                    container.innerHTML = `<div class="space-y-4 pt-1">
                        <div class="skin-card p-4 rounded-3xl border skin-border flex justify-between items-center"><span class="font-extrabold skin-sub text-base sm:text-lg">${L('dtBase')}</span><input id="dt-start" type="date" value="${today}" onchange="calcDateTarget()" class="bg-transparent text-right font-mono font-extrabold text-xl skin-text focus:outline-none"></div>
                        <div class="skin-card p-4 rounded-3xl border skin-border flex justify-between items-center"><span class="font-extrabold skin-sub text-base sm:text-lg">${L('dtDays')}</span><input id="dt-days" type="number" value="100" oninput="calcDateTarget()" class="w-1/2 bg-transparent text-right font-mono font-extrabold text-[27px] skin-text focus:outline-none"></div>
                        <div class="mt-3 p-6 skin-card rounded-[2.5rem] text-center border skin-border shadow-xl"><div class="text-sm font-bold skin-accent-text">${L('dtTarget')}</div><div id="dt-result" class="text-3xl font-black skin-text my-2 font-mono"></div></div>
                        ${renderNoteCard('date_target')}
                    </div>`; calcDateTarget();
                }
            }
            else if (type === 'age') {
                container.innerHTML = `<div class="space-y-4 pt-1">
                    <div class="skin-card p-4 rounded-3xl border skin-border flex justify-between items-center"><span class="font-extrabold skin-sub text-base sm:text-lg">${L('agBirth')}</span><input id="age-birth" type="date" value="2000-01-01" onchange="calcAge()" class="bg-transparent text-right font-mono font-extrabold text-xl skin-text focus:outline-none"></div>
                    <div class="mt-3 grid grid-cols-3 gap-3">
                        <div class="skin-card p-4 rounded-3xl border skin-border text-center"><div id="age-y" class="text-3xl font-black skin-accent-text font-mono">0</div><div class="text-sm font-bold skin-sub mt-1">${L('agY')}</div></div>
                        <div class="skin-card p-4 rounded-3xl border skin-border text-center"><div id="age-m" class="text-3xl font-black skin-accent-text font-mono">0</div><div class="text-sm font-bold skin-sub mt-1">${L('agM')}</div></div>
                        <div class="skin-card p-4 rounded-3xl border skin-border text-center"><div id="age-d" class="text-3xl font-black skin-accent-text font-mono">0</div><div class="text-sm font-bold skin-sub mt-1">${L('agD')}</div></div>
                    </div>
                    <div class="p-5 skin-card rounded-3xl border skin-border text-center mt-2 shadow-md"><div class="text-sm font-bold skin-sub">${L('agNext')}</div><div id="age-next" class="text-3xl font-black skin-text mt-1 font-mono">0 天</div></div>
                    ${renderNoteCard('age')}
                </div>`; calcAge();
            }
            else if (type === 'lunar') {
                let today = new Date().toISOString().split('T')[0];
                container.innerHTML = `<div class="space-y-4 pt-1 flex flex-col">
                    <div class="skin-card p-4 rounded-3xl border skin-border"><div class="text-sm font-bold skin-sub mb-1.5">${L('luDate')}</div><input id="lunar-in" type="date" value="${today}" onchange="calcLunar()" class="w-full bg-transparent font-extrabold text-xl skin-text focus:outline-none"></div>
                    <div class="mt-1 p-6 skin-card rounded-[2.5rem] flex flex-col space-y-4 shadow-xl border skin-border relative overflow-hidden">
                        <div class="flex justify-between items-center border-b skin-border pb-3"><span class="skin-sub font-bold text-lg">${L('luWeek')}</span><span id="lun-week" class="text-2xl font-extrabold skin-text"></span></div>
                        <div class="flex justify-between items-center border-b skin-border pb-3"><span class="skin-sub font-bold text-lg">${L('luZodiac')}</span><span id="lun-zodiac" class="text-2xl font-extrabold skin-accent-text"></span></div>
                        <div class="flex flex-col pt-1"><span class="skin-sub font-bold text-lg mb-1">${L('luLunar')}</span><div class="text-right"><div id="lun-y" class="text-base font-bold skin-accent-text mb-1"></div><div id="lun-md" class="text-3xl font-black skin-text"></div></div></div>
                    </div>
                    ${renderNoteCard('lunar')}
                </div>`; calcLunar();
            }
            else if (type === 'color') {
                container.innerHTML = `<div class="space-y-4 pt-1">
                    <div class="skin-card p-4 rounded-3xl border skin-border flex items-center"><span class="font-extrabold skin-sub w-1/4 text-base sm:text-lg">HEX</span><input id="col-hex" type="text" value="#FF6600" oninput="calcColor('hex')" class="w-3/4 bg-transparent text-right font-mono font-extrabold text-2xl skin-text focus:outline-none uppercase"></div>
                    <div class="skin-card p-4 rounded-3xl border skin-border flex items-center"><span class="font-extrabold skin-sub w-1/4 text-base sm:text-lg">RGB</span><input id="col-rgb" type="text" value="255, 102, 0" oninput="calcColor('rgb')" class="w-3/4 bg-transparent text-right font-mono font-extrabold text-2xl skin-text focus:outline-none"></div>
                    <div class="mt-4 flex justify-center"><div id="col-preview" class="w-28 h-28 rounded-full shadow-2xl border-4 skin-border" style="background-color: #FF6600"></div></div>
                    ${renderNoteCard('color')}
                </div>`;
            }
            refreshIcons();
        }

        // 各工具運算函式
        function calcDiscount() {
            let price = parseFloat(document.getElementById('dc-price').value) || 0;
            let discount = parseFloat(document.getElementById('dc-discount').value) || 100;
            let rate = discount > 10 ? discount / 100 : discount / 10;
            let finalPrice = Math.round(price * rate);
            let saved = price - finalPrice;
            document.getElementById('dc-final').innerText = `$${finalPrice.toLocaleString()}`;
            document.getElementById('dc-saved').innerText = `$${saved.toLocaleString()}`;
        }

        function calcTip() {
            let amount = parseFloat(document.getElementById('tip-amount').value) || 0;
            let rate = (parseFloat(document.getElementById('tip-rate').value) || 0) / 100;
            let people = Math.max(1, parseInt(document.getElementById('tip-people').value) || 1);
            let tip = Math.round(amount * rate);
            let total = amount + tip;
            let perPerson = Math.round(total / people);
            document.getElementById('tip-per-person').innerText = `$${perPerson.toLocaleString()}`;
            document.getElementById('tip-total').innerText = `$${total.toLocaleString()}`;
        }

        function calcBMI() {
            let h = parseFloat(document.getElementById('bmi-h').value) / 100, w = parseFloat(document.getElementById('bmi-w').value);
            if (!h || !w || h <= 0) return; let bmi = (w / (h * h)).toFixed(1); document.getElementById('bmi-val').innerText = bmi;
            let st = document.getElementById('bmi-status');
            if (bmi < 18.5) { st.innerText = L('bmiUnder') + ' (<18.5)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-amber-500/20 text-amber-400 mt-1'; }
            else if (bmi < 24) { st.innerText = L('bmiNormal') + ' (18.5-24)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-emerald-500/20 text-emerald-400 mt-1'; }
            else if (bmi < 27) { st.innerText = L('bmiOver') + ' (24-27)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-orange-500/20 text-orange-400 mt-1'; }
            else { st.innerText = L('bmiObese') + ' (≥27)'; st.className = 'inline-block px-5 py-2 rounded-full text-sm font-extrabold bg-red-500/20 text-red-400 mt-1'; }
        }

        function calcMortgage() {
            let p = (parseFloat(document.getElementById('mg-amount').value)||0)*10000, r = (parseFloat(document.getElementById('mg-rate').value)||0)/100/12, n = (parseFloat(document.getElementById('mg-years').value)||0)*12;
            if (p<=0||r<=0||n<=0) { document.getElementById('mg-result').innerText = '$0'; return; }
            document.getElementById('mg-result').innerText = `$${Math.round((p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1)).toLocaleString()}`;
        }

        function calcCompound() {
            let p = parseFloat(document.getElementById('cp-init').value)||0, m = parseFloat(document.getElementById('cp-month').value)||0, r = (parseFloat(document.getElementById('cp-rate').value)||0)/100/12, n = (parseFloat(document.getElementById('cp-years').value)||0)*12;
            let future = p * Math.pow(1+r, n) + m * ((Math.pow(1+r, n) - 1) / r);
            document.getElementById('cp-total').innerText = `$${Math.round(future).toLocaleString()}`;
        }

        function calcTravel() {
            let amt = parseFloat(document.getElementById('tvl-amt').value)||0;
            let foreign = document.getElementById('tvl-foreign').value;
            let home = document.getElementById('tvl-home').value;
            let baseUSD = amt / (currencyRates[foreign] || 1);
            let homeVal = baseUSD * (currencyRates[home] || 1);
            document.getElementById('tvl-res').innerText = homeVal < 100 ? homeVal.toFixed(2) : Math.round(homeVal).toLocaleString();

            const table = document.getElementById('tvl-table');
            const amounts = [100, 500, 1000, 5000, 10000];
            table.innerHTML = amounts.map(a => {
                let v = (a / (currencyRates[foreign]||1)) * (currencyRates[home]||1);
                let fv = v < 100 ? v.toFixed(2) : Math.round(v).toLocaleString();
                return `<div class="flex justify-between border-b skin-border py-1.5"><span class="skin-sub">${a}</span><span class="font-extrabold skin-text">${fv}</span></div>`;
            }).join('');
        }

        function calcLunar() {
            let d = new Date(document.getElementById('lunar-in').value);
            if(isNaN(d)) return;
            const weeks = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            if (isZh()) {
                document.getElementById('lun-week').innerText = weeks[d.getDay()];
            } else {
                try { document.getElementById('lun-week').innerText = d.toLocaleDateString(currentLang, { weekday: 'long' }); }
                catch (e) { document.getElementById('lun-week').innerText = weeks[d.getDay()]; }
            }
            const zodiac = ['摩羯座', '水瓶座', '雙魚座', '牡羊座', '金牛座', '雙子座', '巨蟹座', '獅子座', '處女座', '天秤座', '天蠍座', '射手座', '摩羯座'];
            const zodiacEn = ['Capricorn', 'Aquarius', 'Pisces', 'Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn'];
            const days = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            let m = d.getMonth() + 1, day = d.getDate();
            const zList = isZh() ? zodiac : zodiacEn;
            document.getElementById('lun-zodiac').innerText = day < days[m - 1] ? zList[m - 1] : zList[m];
            try {
                if(typeof Solar !== 'undefined') {
                    let solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, d.getDate());
                    let lunar = solar.getLunar();
                    document.getElementById('lun-y').innerText = `${lunar.getYearInGanZhi()}年 (${lunar.getYearShengXiao()}年)`;
                    document.getElementById('lun-md').innerText = `${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                }
            } catch(e) {}
        }

        function calcDate() {
            let d1 = new Date(document.getElementById('date-start').value), d2 = new Date(document.getElementById('date-end').value);
            if(!isNaN(d1) && !isNaN(d2)) document.getElementById('date-result').innerText = `${Math.ceil(Math.abs(d2 - d1) / 86400000)} ${L('day')}`;
        }

        function calcDateTarget() {
            let d = new Date(document.getElementById('dt-start').value), days = parseInt(document.getElementById('dt-days').value)||0;
            if(!isNaN(d)) { d.setDate(d.getDate() + days); document.getElementById('dt-result').innerText = d.toISOString().split('T')[0]; }
        }

        function calcAge() {
            let b = new Date(document.getElementById('age-birth').value), now = new Date();
            if(isNaN(b) || b > now) return;
            let y = now.getFullYear() - b.getFullYear(), m = now.getMonth() - b.getMonth(), d = now.getDate() - b.getDate();
            if (d < 0) { m--; let prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); }
            if (m < 0) { y--; m += 12; }
            document.getElementById('age-y').innerText = y; document.getElementById('age-m').innerText = m; document.getElementById('age-d').innerText = d;
            let next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
            if(now > next) next.setFullYear(now.getFullYear()+1);
            document.getElementById('age-next').innerText = `${Math.ceil((next - now) / 86400000)} ${L('day')}`;
        }

        function calcColor(source) {
            let hex = document.getElementById('col-hex'), rgb = document.getElementById('col-rgb');
            if (source === 'hex') {
                let h = hex.value.replace('#', '');
                if(h.length === 3) h = h.split('').map(x=>x+x).join('');
                if(h.length === 6) {
                    let r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
                    rgb.value = `${r}, ${g}, ${b}`; document.getElementById('col-preview').style.backgroundColor = `#${h}`;
                }
            } else {
                let parts = rgb.value.split(',').map(x=>parseInt(x.trim()));
                if(parts.length===3 && !parts.some(isNaN)) {
                    let h = '#' + parts.map(x=>{let s = Math.max(0,Math.min(255,x)).toString(16); return s.length===1?'0'+s:s;}).join('').toUpperCase();
                    hex.value = h; document.getElementById('col-preview').style.backgroundColor = h;
                }
            }
        }

        function convertChineseNum() {
            const numStr = document.getElementById('cnum-in').value;
            if(!numStr) { document.getElementById('cnum-out').innerText = '零'; return; }
            const chars = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'], units = ['','拾','佰','仟','萬','拾','佰','仟','億','拾','佰','仟'];
            let res = '', zeroFlag = false, strRev = numStr.split('').reverse().join('');
            for(let i=0; i<strRev.length; i++) {
                let d = parseInt(strRev[i]);
                if (d===0) { if(i===4)res='萬'+res; else if(i===8)res='億'+res; zeroFlag = true; }
                else { if(zeroFlag && i!==4 && i!==8)res='零'+res; res=chars[d]+units[i]+res; zeroFlag=false; }
            }
            document.getElementById('cnum-out').innerText = res.replace(/零萬/g,'萬').replace(/零億/g,'億').replace(/億萬/g,'億').replace(/零+$/,'') || '零';
        }

        function copyText(id) {
            const el = document.createElement('textarea'); el.value = document.getElementById(id).innerText;
            document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            const txt = i18n[currentLang] || i18n['zh-TW'];
            showToast(txt.copied || '已複製數值');
        }

        /* ===== Modal 控制 ===== */
        function openHistoryModal() {
            const list = document.getElementById('history-list');
            const txt = i18n[currentLang] || i18n['zh-TW'];
            list.innerHTML = historyRecords.length ? historyRecords.map(item => {
                const safeFormula = item.replace(/"/g, '&quot;');
                return `
                    <div class="history-item skin-card p-4 rounded-2xl font-mono skin-text text-right text-[19px] cursor-pointer border skin-border hover:opacity-80 transition-opacity btn-active" data-formula="${safeFormula}" title="點擊複製整條算式">
                        ${item}
                    </div>
                `;
            }).join('') : `<div class="text-center skin-sub py-10 font-bold text-[19px]">${txt.noHistory || '暫無紀錄'}</div>`;
            
            list.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    const formula = el.dataset.formula || el.innerText.trim();
                    copyToClipboard(formula).then((ok) => {
                        showToast(ok ? L('toastCopy') : L('toastCopyFail'));
                    });
                });
            });
            
            const modal = document.getElementById('history-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('history-modal-content').classList.remove('scale-95');
            }, 10);
            refreshIcons();
        }

        function closeHistoryModal() { 
            document.getElementById('history-modal-content').classList.add('scale-95');
            const modal = document.getElementById('history-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function clearHistory() { historyRecords = []; localStorage.removeItem('calc_history_data'); openHistoryModal(); }

        function showToast(msg) {
            const t = document.getElementById('custom-toast'); t.innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2000);
        }
    </script>

    <!-- PWA Service Worker 註冊（部署到 HTTP/HTTPS 後自動啟用離線快取） -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('✅ SW registered:', reg.scope))
                    .catch((err) => console.log('❌ SW failed:', err));
            });
        }
    </script>
</body>
</html>
